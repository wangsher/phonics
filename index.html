<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>26字母自然發音蘋果樹</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 20px; 
      background-color: #f0f8ff; 
      color: #333;
    }
    h2 { color: #2e8b57; }
    #tree-display { 
      font-size: 100px; 
      margin: 20px 0; 
      height: 120px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }
    #progress-text { 
      font-size: 18px; 
      font-weight: bold; 
      color: #555; 
      margin-bottom: 20px;
    }
    #quiz-container { text-align: center; display: none; }
    #start-screen { text-align: center; margin-top: 50px; }
    .btn-main {
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background-color: #4CAF50;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.3s;
    }
    .btn-main:hover { background-color: #45a049; }
    .btn-audio { 
      margin: 10px 0 20px 0; 
      padding: 12px 24px; 
      font-size: 18px; 
      cursor: pointer; 
      background-color: #e0f7fa; 
      border: 2px solid #00acc1; 
      border-radius: 8px; 
      font-weight: bold;
      color: #00838f;
    }
    .btn-audio:hover { background-color: #b2ebf2; }
    .btn-option { 
      display: inline-block; 
      margin: 10px; 
      padding: 15px 30px; 
      font-size: 28px; 
      font-weight: bold; 
      cursor: pointer; 
      border: 2px solid #ccc; 
      border-radius: 10px; 
      background-color: #fff; 
      transition: all 0.2s; 
    }
    .btn-option:hover { 
      background-color: #f1f1f1; 
      border-color: #888;
    }
    #status-bar { 
      margin-top: 20px; 
      font-size: 22px; 
      font-weight: bold; 
      height: 30px; 
    }
  </style>
</head>
<body>

  <h2>🌱 26字母自然發音挑戰</h2>
  <div id="tree-display">🌰</div>
  <div id="progress-text">進度：0 / 26</div>
  
  <div id="start-screen">
    <p style="font-size: 18px; color: #666; margin-bottom: 20px;">聽語音，選出正確的開頭字母，幫助蘋果樹長大！</p>
    <button class="btn-main" onclick="startGame()">▶️ 開始測驗</button>
  </div>

  <div id="quiz-container">
    <button class="btn-audio" onclick="playPhonicsAudio()">🔊 再聽一次發音</button>
    <p style="font-size: 18px; color: #444; font-weight: bold;">請選出正確的開頭字母：</p>
    <div id="options-container"></div>
  </div>

  <p id="status-bar"></p>

  <script>
    const phonicsData = [
      { letter: "A", word: "apple" }, { letter: "B", word: "bear" },
      { letter: "C", word: "cat" }, { letter: "D", word: "dog" },
      { letter: "E", word: "elephant" }, { letter: "F", word: "fish" },
      { letter: "G", word: "goat" }, { letter: "H", word: "hat" },
      { letter: "I", word: "igloo" }, { letter: "J", word: "juice" },
      { letter: "K", word: "kite" }, { letter: "L", word: "lion" },
      { letter: "M", word: "monkey" }, { letter: "N", word: "nest" },
      { letter: "O", word: "octopus" }, { letter: "P", word: "pig" },
      { letter: "Q", word: "queen" }, { letter: "R", word: "rabbit" },
      { letter: "S", word: "sun" }, { letter: "T", word: "tiger" },
      { letter: "U", word: "umbrella" }, { letter: "V", word: "van" },
      { letter: "W", word: "water" }, { letter: "X", word: "fox" }, 
      { letter: "Y", word: "yo-yo" }, { letter: "Z", word: "zebra" }
    ];

    let quizQueue = [];
    const stages = ["🌰", "🌱", "🌿", "🌸", "🌳", "🍎🌳🍎"];
    let correctCount = 0;
    const totalQuestions = phonicsData.length;
    let isProcessing = false;

    function startGame() {
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("quiz-container").style.display = "block";
      
      quizQueue = [...phonicsData].sort(() => Math.random() - 0.5);
      correctCount = 0;
      updateProgressUI();
      renderQuestion();
    }

    function playPhonicsAudio() {
      if (quizQueue.length === 0) return;
      const currentItem = quizQueue[0];
      
      // 降低語速至 0.8 以符合學習扶助學生的需求
      const textToSpeak = `${currentItem.letter}.... ${currentItem.word}`;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.8; 
      speechSynthesis.speak(utterance);
    }

    function generateOptions(correctLetter) {
      let options = new Set([correctLetter]);
      const allLetters = phonicsData.map(d => d.letter);
      
      while(options.size < 3) {
        const randomLetter = allLetters[Math.floor(Math.random() * allLetters.length)];
        options.add(randomLetter);
      }
      return Array.from(options).sort(() => Math.random() - 0.5);
    }

    function renderQuestion() {
      isProcessing = false;
      if (quizQueue.length === 0) {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("status-bar").innerText = "恭喜！26字母自然發音測驗全部完成！";
        document.getElementById("status-bar").style.color = "#2e8b57";
        return;
      }
      
      const currentItem = quizQueue[0];
      const optContainer = document.getElementById("options-container");
      optContainer.innerHTML = "";
      
      const options = generateOptions(currentItem.letter);
      
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, currentItem.letter);
        optContainer.appendChild(btn);
      });

      // 載入題目時自動播放語音
      setTimeout(playPhonicsAudio, 300);
    }

    function checkAnswer(selected, correct) {
      if (isProcessing) return; 
      isProcessing = true;

      const statusBar = document.getElementById("status-bar");
      
      if (selected === correct) {
        correctCount++;
        statusBar.innerText = "✅ 正確！";
        statusBar.style.color = "green";
        quizQueue.shift(); 
      } else {
        statusBar.innerText = `❌ 再試一次！剛才是字母 ${correct}`;
        statusBar.style.color = "red";
        const wrongItem = quizQueue.shift();
        quizQueue.push(wrongItem); 
      }

      updateProgressUI();
      setTimeout(() => { 
        statusBar.innerText = ""; 
        renderQuestion(); 
      }, 1500);
    }

    function updateProgressUI() {
      document.getElementById("progress-text").innerText = `進度：${correctCount} / ${totalQuestions}`;
      let stageIndex = Math.floor(correctCount / 5);
      if (stageIndex >= stages.length) stageIndex = stages.length - 1;
      document.getElementById("tree-display").innerText = stages[stageIndex];
    }
  </script>
</body>
</html>
